[project]
name = "avefi_schema"
version = "0.4.0"
description = "Schema for persistent film identifiers developed in the AVefi project"
authors = [
    {name = "AVefi Working Group", email = "contact@av-efi.net"},
]
dependencies = [
    "pydantic>=2.13.3",
    "jsonschema>=4.23",
]
requires-python = ">=3.11,<4"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
avefi-validate = "avefi_validate.cli:main"

[project.optional-dependencies]
dataclasses = [
    "linkml-runtime>=1.10.0",
]
fast = [
    "jsonschema-rs>=0.61,<0.62",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "project/python/avefi_schema",
    "src/python/avefi_validate",
]

[tool.hatch.build.targets.sdist]
include = [
    "/dodo.py",
    "/examples",
    "/LICENSE",
    "/project",
    "/README.md",
    "/src",
    "/tests",
    "/utils",
    "/uv.lock",
    "/zensical.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "linkml>=1.12.0,<1.13.0",
    "doit>=0.36.0",
    "ruamel-yaml>=0.18.6",
    "requests>=2.32.3",
    "deepdiff>=7.0.1",
    "zensical>=0.0.34",
    "pytest>=8.0",
    "pre-commit>=4.0",
    "jsonschema-rs>=0.61,<0.62",
]
docs = [
    "doit>=0.36.0",
    "linkml>=1.10.0",
    "zensical>=0.0.34",
]
